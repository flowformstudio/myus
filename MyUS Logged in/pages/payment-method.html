<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Method · MyUS.com</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/dashboard.css?v=2" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/multi.css" />
  <link rel="stylesheet" href="../styles/membership.css" />
  <link rel="stylesheet" href="../styles/settings.css" />
</head>
<body class="page" data-page="payment-method">

  <div data-slot="topbar"></div>

  <div class="layout">
    <div data-slot="sidebar"></div>

    <main class="main">

      <section class="card mp-card pm-card">
        <h1 class="mp-title">Payment Method</h1>
        <p class="ab-intro">Update your payment method and add new payment options below.</p>

        <div class="pm-card-row">
          <div class="pm-card-info">
            <span class="pm-brand pm-brand-visa">VISA</span>
            <div class="pm-card-text">
              <div class="pm-card-name">Visa ending in 5052</div>
              <div class="pm-card-exp">Exp 08/23</div>
            </div>
          </div>
          <a class="sp-link" href="#">Update</a>
        </div>

        <button type="button" class="mp-btn-primary pm-add-btn">Add Credit Card</button>

        <hr class="mp-divider mp-divider-spaced" />

        <h3 class="pm-h3">Other Payment Methods</h3>
        <p class="pm-sub">We accept wire transfers and checks, payable in US dollars. We are currently unable to accept Western Union transfers.</p>
        <div class="pm-other-row">
          <button type="button" class="pm-btn-outline">Wire Transfer</button>
          <span class="pm-or">OR</span>
          <button type="button" class="pm-btn-outline">Check or Money Order</button>
        </div>

      </section>

    </main>
  </div>

  <div data-slot="footer"></div>
  <script src="../scripts/layout.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>All Locations · MyUS.com</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/dashboard.css?v=2" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/multi.css" />
</head>
<body class="page all-loc-page" data-page="all-locations">

  <div data-slot="topbar"></div>

  <div class="layout">
    <div data-slot="sidebar"></div>

    <main class="main">

      <div class="page-header">
        <h1>All locations</h1>
        <span class="page-counter" data-page-counter>… locations</span>
      </div>

      <section class="card">
        <div class="loc-table-head">
          <div>
            <h3 style="color:var(--navy-900); margin-bottom: 6px">All Locations</h3>
            <div class="count-line" data-loc-count style="font-size:14px;color:var(--ink-600);font-weight:500">… Locations</div>
          </div>
          <div class="loc-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" placeholder="Search for location" />
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>

        <table class="loc-table" data-loc-table-full>
          <thead>
            <tr>
              <th style="width:220px">Country</th>
              <th>Address</th>
              <th style="width:380px">Status <span class="sort-arrow">↑↓</span></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

    </main>
  </div>

  <div data-slot="footer"></div>
  <script src="../scripts/data-render.js"></script>
  <script src="../scripts/layout.js"></script>
</body>
</html>

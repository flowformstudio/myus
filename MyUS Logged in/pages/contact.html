<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us · MyUS.com</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/dashboard.css" />
  <link rel="stylesheet" href="../styles/components.css" />
</head>
<body class="page" data-page="contact">

  <div data-slot="topbar"></div>

  <div class="layout">
    <div data-slot="sidebar"></div>

    <main class="main">

      <div class="page-header">
        <div>
          <h1>Contact Us</h1>
          <p class="page-sub">Need help now? Contact us by Chat or <a href="https://api.whatsapp.com/send?phone=19412257374">WhatsApp</a>! If you submit a message below, please allow 24 hours for a response.</p>
        </div>
      </div>

      <div class="contact-grid">

        <!-- Quick channels -->
        <aside class="contact-side">
          <div class="card channel">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <div>
              <strong>WhatsApp</strong>
              <div class="muted">+1 (941) 225-7374</div>
            </div>
            <a class="btn btn-outline compact" href="https://api.whatsapp.com/send?phone=19412257374">Chat</a>
          </div>
          <div class="card channel">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <div>
              <strong>Phone</strong>
              <div class="muted">+1 (941) 227-4444</div>
            </div>
            <a class="btn btn-outline compact" href="tel:+19412274444">Call</a>
          </div>
          <div class="card channel">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <div>
              <strong>Live Chat</strong>
              <div class="muted">Average wait under 2 min</div>
            </div>
            <button class="btn btn-outline compact">Start chat</button>
          </div>
        </aside>

        <!-- Contact form -->
        <section class="card">
          <h3 style="color:var(--navy-900); margin-bottom: var(--s-4)">Send Us a Message</h3>

          <div class="field-row">
            <div class="field">
              <label>First Name <span style="color:var(--danger)">*</span></label>
              <input class="input" type="text" value="Igor" />
            </div>
            <div class="field">
              <label>Last Name <span style="color:var(--danger)">*</span></label>
              <input class="input" type="text" value="Ginzburg" />
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label>Suite Number <span style="color:var(--danger)">*</span></label>
              <input class="input" type="text" value="6340-104" />
            </div>
            <div class="field">
              <label>Email Address <span style="color:var(--danger)">*</span></label>
              <input class="input" type="email" value="ginzburgigor@gmail.com" />
            </div>
          </div>

          <div class="field">
            <label>How can we help? <span style="color:var(--danger)">*</span></label>
            <select class="select">
              <option>--select an item--</option>
              <option>Not a customer yet — tell me more</option>
              <option>My account settings, payment issues</option>
              <option>My inbound package(s)</option>
              <option>My outbound shipment(s)</option>
              <option>MyUS shopping services</option>
            </select>
          </div>

          <div class="field">
            <label>Provide more details here <span style="color:var(--danger)">*</span></label>
            <textarea class="textarea" rows="5" placeholder="Tell us what's going on…"></textarea>
          </div>

          <div class="field">
            <label>Upload file <span class="muted">(PDF, TIF, BMP, JPG — optional)</span></label>
            <button class="btn btn-ghost" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Add File…
            </button>
          </div>

          <div class="form-actions">
            <button class="btn btn-primary compact">Send</button>
          </div>
        </section>

      </div>

    </main>
  </div>

  <div data-slot="footer"></div>
  <script src="../scripts/layout.js"></script>
  <style>
    .contact-grid { display: grid; grid-template-columns: 300px 1fr; gap: var(--s-5); align-items: start; }
    @media (max-width: 900px) { .contact-grid { grid-template-columns: 1fr; } }
    .contact-side { display: flex; flex-direction: column; gap: var(--s-3); }
    .channel { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4); }
    .channel svg { color: var(--blue-600); flex-shrink: 0; }
    .channel strong { color: var(--navy-900); font-size: 14px; }
    .channel .muted { font-size: 12px; margin-top: 2px; }
    .channel > div:nth-child(2) { flex: 1; }
  </style>
</body>
</html>

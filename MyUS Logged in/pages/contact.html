<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us · MyUS.com</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/dashboard.css?v=2" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/multi.css" />
  <link rel="stylesheet" href="../styles/membership.css" />
  <link rel="stylesheet" href="../styles/settings.css" />
  <link rel="stylesheet" href="../styles/tools.css" />
</head>
<body class="page" data-page="contact">

  <div data-slot="topbar"></div>

  <div class="layout">
    <div data-slot="sidebar"></div>

    <main class="main">

      <section class="card mp-card ct-card">
        <h1 class="mp-title">Contact Us</h1>
        <p class="ct-intro">Need help now? Contact us by Chat or <a class="sp-link" href="https://api.whatsapp.com/send?phone=19412257374" target="_blank" rel="noopener">WhatsApp</a>!<br />If you submit a message below, please allow 24 hours for a response.</p>

        <h3 class="ct-h3">Send Us a Message</h3>

        <form class="ct-form" autocomplete="off">
          <div class="ct-field">
            <label class="ct-label" for="ct-fname">First Name <span class="mp-required">*</span></label>
            <input id="ct-fname" type="text" class="mp-input ct-input" required />
          </div>
          <div class="ct-field">
            <label class="ct-label" for="ct-lname">Last Name <span class="mp-required">*</span></label>
            <input id="ct-lname" type="text" class="mp-input ct-input" required />
          </div>
          <div class="ct-field">
            <label class="ct-label" for="ct-suite">Suite Number <span class="mp-required">*</span></label>
            <input id="ct-suite" type="text" class="mp-input ct-input" required />
          </div>
          <div class="ct-field">
            <label class="ct-label" for="ct-email">Email Address <span class="mp-required">*</span></label>
            <input id="ct-email" type="email" class="mp-input ct-input" required />
          </div>
          <div class="ct-field">
            <label class="ct-label" for="ct-topic">How can we help? <span class="mp-required">*</span></label>
            <select id="ct-topic" class="mp-select ct-input" required>
              <option value="" selected>--select an item--</option>
              <option>Not a customer yet - tell me more</option>
              <option>My account settings, payment issues</option>
              <option>My inbound package(s)</option>
              <option>My outbound shipment(s)</option>
              <option>MyUS shopping services</option>
            </select>
          </div>
          <div class="ct-field">
            <label class="ct-label" for="ct-details">Provide more details here. <span class="mp-required">*</span></label>
            <textarea id="ct-details" class="mp-input ct-input ct-textarea" required></textarea>
          </div>

          <div class="ct-field">
            <label class="ct-label" for="ct-captcha">Type the characters you see in this image <span class="mp-required">*</span></label>
            <div class="ct-captcha">
              <span class="ct-captcha-img" aria-label="Captcha image">Sy8p6u0</span>
            </div>
            <input id="ct-captcha" type="text" class="mp-input ct-input" required />
          </div>

          <div class="ct-field">
            <label class="ct-label">Upload file (PDF, TIF, BMP, JPG)</label>
            <label class="ct-file-btn">
              Add File...
              <input type="file" accept=".pdf,.tif,.bmp,.jpg,.jpeg" hidden />
            </label>
          </div>

          <div class="ct-submit">
            <button type="submit" class="ct-send">Send</button>
          </div>
        </form>

      </section>

    </main>
  </div>

  <div data-slot="footer"></div>
  <script src="../scripts/layout.js"></script>
</body>
</html>

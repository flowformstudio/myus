<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Communications · MyUS.com</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/dashboard.css?v=2" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/multi.css" />
  <link rel="stylesheet" href="../styles/membership.css" />
  <link rel="stylesheet" href="../styles/settings.css" />
</head>
<body class="page" data-page="communications">

  <div data-slot="topbar"></div>

  <div class="layout">
    <div data-slot="sidebar"></div>

    <main class="main">

      <section class="card mp-card cm-card">
        <h1 class="mp-title">Communications</h1>
        <p class="ab-intro">Manage your communication preferences with MyUS.</p>

        <p class="cm-intro">I would like to receive the latest deals, offers and news from MyUS in accordance with its <a class="sp-link" href="https://www.myus.com/privacy-policy/" target="_blank" rel="noopener">Privacy Policy</a>.</p>
        <p class="cm-select-label">Please select all that apply:</p>

        <div class="cm-toggles">
          <label class="sp-toggle cm-toggle-row">
            <span class="sp-toggle-switch"><input type="checkbox" /><span class="sp-toggle-knob"></span></span>
            <span class="sp-toggle-label">Email</span>
          </label>
          <label class="sp-toggle cm-toggle-row">
            <span class="sp-toggle-switch"><input type="checkbox" /><span class="sp-toggle-knob"></span></span>
            <span class="sp-toggle-label">Text/SMS</span>
          </label>
          <label class="sp-toggle cm-toggle-row">
            <span class="sp-toggle-switch"><input type="checkbox" /><span class="sp-toggle-knob"></span></span>
            <span class="sp-toggle-label">WhatsApp</span>
          </label>
        </div>

        <hr class="mp-divider mp-divider-spaced" />

        <div class="mp-actions">
          <button type="submit" class="mp-save" disabled>Save Changes</button>
        </div>

      </section>

    </main>
  </div>

  <div data-slot="footer"></div>
  <script src="../scripts/layout.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Communications · MyUS.com</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/dashboard.css" />
  <link rel="stylesheet" href="../styles/components.css" />
</head>
<body class="page" data-page="communications">

  <div data-slot="topbar"></div>

  <div class="layout">
    <div data-slot="sidebar"></div>

    <main class="main">

      <div class="page-header">
        <div>
          <h1>Communications</h1>
          <p class="page-sub">Manage your communication preferences with MyUS.</p>
        </div>
      </div>

      <section class="card" style="max-width:680px">
        <p>I would like to receive the latest deals, offers and news from MyUS in accordance with its <a href="https://www.myus.com/privacy-policy/">Privacy Policy</a>.</p>

        <div class="card-section-subtitle" style="margin-top:var(--s-4)">Please select all that apply</div>
        <div class="comms-grid">
          <label class="comms-option">
            <input type="checkbox" />
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg>
            <span>Email</span>
          </label>
          <label class="comms-option">
            <input type="checkbox" />
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            <span>Text / SMS</span>
          </label>
          <label class="comms-option">
            <input type="checkbox" />
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <span>WhatsApp</span>
          </label>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary compact">Save Changes</button>
        </div>
      </section>

    </main>
  </div>

  <div data-slot="footer"></div>
  <script src="../scripts/layout.js"></script>
  <style>
    .comms-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-3); margin-top: var(--s-3); }
    @media (max-width: 700px) { .comms-grid { grid-template-columns: 1fr; } }
    .comms-option {
      display: flex; align-items: center; gap: var(--s-3);
      padding: var(--s-4); border: 1px solid var(--border); border-radius: var(--r-md);
      cursor: pointer; font-weight: var(--fw-semibold); color: var(--navy-900);
    }
    .comms-option:hover { border-color: var(--blue-600); background: var(--blue-050); }
    .comms-option input { margin: 0; accent-color: var(--blue-600); }
    .comms-option svg { color: var(--blue-600); flex-shrink: 0; margin-left: auto; }
  </style>
</body>
</html>

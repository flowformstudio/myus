<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Information · MyUS.com</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/dashboard.css?v=2" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/multi.css" />
  <link rel="stylesheet" href="../styles/membership.css" />
</head>
<body class="page" data-page="membership-profile">

  <div data-slot="topbar"></div>

  <div class="layout">
    <div data-slot="sidebar"></div>

    <main class="main">

      <section class="card mp-card">
        <h1 class="mp-title">Membership Profile</h1>

        <nav class="mp-tabs" role="tablist">
          <a class="mp-tab is-active" href="membership-profile.html" role="tab" aria-selected="true">Contact Information</a>
          <a class="mp-tab" href="membership-type.html" role="tab">Membership</a>
          <a class="mp-tab" href="myus-family.html" role="tab">MyUS Family</a>
          <a class="mp-tab" href="membership-password.html" role="tab">Password</a>
        </nav>

        <form class="mp-form" autocomplete="off">

          <fieldset class="mp-fieldset">
            <legend class="mp-legend">Primary Account Holder</legend>
            <div class="mp-field">
              <label for="mp-name" class="mp-label">Name</label>
              <input id="mp-name" class="mp-input is-readonly" type="text" value="Igor Ginzburg" readonly />
            </div>
            <div class="mp-field">
              <label for="mp-email" class="mp-label">Email</label>
              <input id="mp-email" class="mp-input is-readonly" type="email" value="ginzburgigor@gmail.com" readonly />
            </div>
          </fieldset>

          <fieldset class="mp-fieldset">
            <legend class="mp-legend">Telephone Numbers</legend>

            <div class="mp-field">
              <label class="mp-label" for="mp-tel-primary">Primary <span class="mp-required">*</span></label>
              <div class="mp-phone-row">
                <select class="mp-select" data-country-select data-default-code="us">
                  <option value="">Select Country</option>
                </select>
                <input id="mp-tel-primary" class="mp-input" type="tel" placeholder="e.g. 123-4567890" value="4155398508" />
              </div>
            </div>

            <div class="mp-field">
              <label class="mp-label" for="mp-tel-secondary">Secondary</label>
              <div class="mp-phone-row">
                <select class="mp-select" data-country-select>
                  <option value="">Select Country</option>
                </select>
                <input id="mp-tel-secondary" class="mp-input" type="tel" placeholder="e.g. 123-4567890" />
              </div>
            </div>

            <div class="mp-field">
              <label class="mp-label" for="mp-tel-alternate">Alternate</label>
              <div class="mp-phone-row">
                <select class="mp-select" data-country-select>
                  <option value="">Select Country</option>
                </select>
                <input id="mp-tel-alternate" class="mp-input" type="tel" placeholder="e.g. 123-4567890" />
              </div>
            </div>

            <div class="mp-field">
              <label class="mp-label" for="mp-tel-fax">Fax</label>
              <div class="mp-phone-row">
                <select class="mp-select" data-country-select>
                  <option value="">Select Country</option>
                </select>
                <input id="mp-tel-fax" class="mp-input" type="tel" placeholder="e.g. 123-4567890" />
              </div>
            </div>
          </fieldset>

          <div class="mp-actions">
            <button type="submit" class="mp-save" disabled>Save Changes</button>
          </div>
        </form>
      </section>

    </main>
  </div>

  <div data-slot="footer"></div>
  <script src="../scripts/layout.js"></script>
  <script src="../scripts/membership-profile.js"></script>
</body>
</html>

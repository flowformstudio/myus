<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exchange Rate Calculator · MyUS.com</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/dashboard.css?v=2" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/multi.css" />
  <link rel="stylesheet" href="../styles/membership.css" />
  <link rel="stylesheet" href="../styles/settings.css" />
  <link rel="stylesheet" href="../styles/tools.css" />
</head>
<body class="page" data-page="exchange-rates">

  <div data-slot="topbar"></div>

  <div class="layout">
    <div data-slot="sidebar"></div>

    <main class="main">

      <section class="card mp-card xr-card">
        <h1 class="mp-title">Exchange Rate Calculator</h1>

        <div class="xr-panel">
          <div class="xr-side" data-side="from">
            <div class="xr-rate" data-rate>1 USD = 0.7414 GBP</div>
            <select class="mp-select xr-select" data-currency>
              <option value="USD" selected>United States Dollar</option>
            </select>
            <div class="xr-input-wrap">
              <input type="number" class="xr-amount" data-amount value="1" min="0" step="0.01" />
              <span class="xr-suffix" data-suffix>USD</span>
            </div>
            <ul class="xr-quick">
              <li><button type="button" data-quick="USD">USD</button></li>
              <li><button type="button" data-quick="GBP">GBP</button></li>
              <li><button type="button" data-quick="EUR">EUR</button></li>
              <li><button type="button" data-quick="CAD">CAD</button></li>
              <li><button type="button" data-quick="JPY">JPY</button></li>
            </ul>
          </div>

          <button type="button" class="xr-swap" aria-label="Swap currencies">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#10283d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </button>

          <div class="xr-side" data-side="to">
            <div class="xr-rate" data-rate>1 GBP = 1.3487 USD</div>
            <select class="mp-select xr-select" data-currency>
              <option value="GBP" selected>British Pound Sterling</option>
            </select>
            <div class="xr-input-wrap">
              <input type="number" class="xr-amount" data-amount value="0.74" min="0" step="0.01" />
              <span class="xr-suffix" data-suffix>GBP</span>
            </div>
            <ul class="xr-quick">
              <li><button type="button" data-quick="USD">USD</button></li>
              <li><button type="button" data-quick="GBP">GBP</button></li>
              <li><button type="button" data-quick="EUR">EUR</button></li>
              <li><button type="button" data-quick="CAD">CAD</button></li>
              <li><button type="button" data-quick="JPY">JPY</button></li>
            </ul>
          </div>
        </div>

      </section>

    </main>
  </div>

  <div data-slot="footer"></div>
  <script src="../scripts/layout.js"></script>
  <script src="../scripts/exchange-rates.js"></script>
</body>
</html>

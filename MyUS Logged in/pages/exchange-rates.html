<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exchange Rate Calculator · MyUS.com</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/dashboard.css" />
  <link rel="stylesheet" href="../styles/components.css" />
</head>
<body class="page" data-page="exchange-rates">

  <div data-slot="topbar"></div>

  <div class="layout">
    <div data-slot="sidebar"></div>

    <main class="main">

      <div class="page-header">
        <h1>Exchange Rate Calculator</h1>
      </div>

      <section class="card fx-card">
        <div class="fx-side">
          <div class="fx-rate">1 USD = 0.7420 GBP</div>
          <select class="select fx-currency">
            <option selected>United States Dollar</option>
            <option>British Pound Sterling</option>
            <option>Euro</option>
            <option>Canadian Dollar</option>
            <option>Japanese Yen</option>
            <option>Australian Dollar</option>
            <option>Indian Rupee</option>
            <option>Chinese Yuan</option>
          </select>
          <div class="fx-amount-row">
            <input class="input fx-input" type="number" value="1" step="0.01" />
            <span class="fx-code">USD</span>
          </div>
          <ul class="fx-quick">
            <li><button class="quick-btn active">USD</button></li>
            <li><button class="quick-btn">GBP</button></li>
            <li><button class="quick-btn">EUR</button></li>
            <li><button class="quick-btn">CAD</button></li>
            <li><button class="quick-btn">JPY</button></li>
          </ul>
        </div>

        <button class="fx-swap" aria-label="Swap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>

        <div class="fx-side">
          <div class="fx-rate">1 GBP = 1.3477 USD</div>
          <select class="select fx-currency">
            <option>United States Dollar</option>
            <option selected>British Pound Sterling</option>
            <option>Euro</option>
            <option>Canadian Dollar</option>
            <option>Japanese Yen</option>
            <option>Australian Dollar</option>
            <option>Indian Rupee</option>
            <option>Chinese Yuan</option>
          </select>
          <div class="fx-amount-row">
            <input class="input fx-input" type="number" value="0.74" step="0.01" />
            <span class="fx-code">GBP</span>
          </div>
          <ul class="fx-quick">
            <li><button class="quick-btn">USD</button></li>
            <li><button class="quick-btn active">GBP</button></li>
            <li><button class="quick-btn">EUR</button></li>
            <li><button class="quick-btn">CAD</button></li>
            <li><button class="quick-btn">JPY</button></li>
          </ul>
        </div>
      </section>

    </main>
  </div>

  <div data-slot="footer"></div>
  <script src="../scripts/layout.js"></script>
  <style>
    .fx-card { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--s-5); align-items: center; padding: var(--s-6); }
    @media (max-width: 800px) { .fx-card { grid-template-columns: 1fr; } .fx-swap { transform: rotate(90deg); } }
    .fx-side { display: flex; flex-direction: column; gap: var(--s-3); }
    .fx-rate { font-size: 13px; color: var(--ink-600); font-weight: var(--fw-semibold); text-align: center; }
    .fx-amount-row {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--s-2);
      background: var(--ink-50); border: 1px solid var(--border); border-radius: var(--r-md);
      padding: var(--s-2) var(--s-3);
    }
    .fx-input { border: none; background: transparent; font-size: 22px; font-weight: var(--fw-bold); padding: 4px 0; color: var(--navy-900); }
    .fx-input:focus { box-shadow: none; }
    .fx-code { font-weight: var(--fw-bold); color: var(--navy-900); padding: 0 var(--s-2); }
    .fx-quick { list-style: none; padding: 0; margin: 0; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .quick-btn {
      background: #fff; border: 1px solid var(--border); border-radius: var(--r-pill);
      padding: 4px 12px; font-family: inherit; font-size: 12px; font-weight: var(--fw-semibold); color: var(--ink-600);
      cursor: pointer;
    }
    .quick-btn.active { background: var(--blue-600); color: #fff; border-color: var(--blue-600); }
    .fx-swap {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--blue-050); border: 1px solid var(--blue-600); color: var(--blue-600);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      justify-self: center;
    }
    .fx-swap:hover { background: var(--blue-600); color: #fff; }
  </style>
</body>
</html>

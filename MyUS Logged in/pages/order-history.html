<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order History · MyUS.com</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/dashboard.css?v=2" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/multi.css" />
  <link rel="stylesheet" href="../styles/membership.css" />
  <link rel="stylesheet" href="../styles/settings.css" />
</head>
<body class="page" data-page="order-history">

  <div data-slot="topbar"></div>

  <div class="layout">
    <div data-slot="sidebar"></div>

    <main class="main">

      <section class="card mp-card oh-card">
        <h1 class="mp-title">Order History</h1>
        <p class="ab-intro">View your completed MyUS shipments, transactions and orders here. Ship requests still in process can be found in your <a class="sp-link" href="#">Shipping Queue</a>.</p>

        <div class="oh-toolbar">
          <div class="oh-filters">
            <span class="oh-filters-label">Show Last:</span>
            <div class="oh-filter-pills">
              <button type="button" class="oh-pill is-active">30 Days</button>
              <span class="oh-pill-sep">|</span>
              <button type="button" class="oh-pill">60 Days</button>
              <span class="oh-pill-sep">|</span>
              <button type="button" class="oh-pill">90 Days</button>
              <span class="oh-pill-sep">|</span>
              <button type="button" class="oh-pill">All</button>
            </div>
          </div>
          <div class="oh-search">
            <input type="search" class="oh-search-input" placeholder="Search for invoice" aria-label="Search for invoice" />
            <button type="button" class="oh-search-btn" aria-label="Search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10283d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
          </div>
        </div>

        <div class="oh-empty"></div>

      </section>

    </main>
  </div>

  <div data-slot="footer"></div>
  <script src="../scripts/layout.js"></script>
</body>
</html>
